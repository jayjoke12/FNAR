plugins {
    id 'com.android.application'
}

android {
    namespace 'com.encrize.fnaf'
    compileSdk 35

    defaultConfig {
        applicationId 'com.encrize.fnaf'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
                targets 'fnaf'
            }
        }
    }

    externalNativeBuild {
        cmake {
            // app/build.gradle -> android/app -> repository root
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            // Debug signing makes locally-built release APKs installable.
            // Replace with your own release keystore before publishing.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
